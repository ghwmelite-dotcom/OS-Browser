<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="gh3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CE1126"/>
      <stop offset="50%" stop-color="#FCD116"/>
      <stop offset="100%" stop-color="#006B3F"/>
    </linearGradient>
    <linearGradient id="bolt3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#FCD116"/>
    </linearGradient>
    <radialGradient id="glow3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#006B3F" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#006B3F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4A017" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#D4A017" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="320" rx="18" fill="#050505"/>
  <ellipse cx="280" cy="170" rx="300" ry="160" fill="url(#glow3)"/>
  <ellipse cx="1010" cy="170" rx="300" ry="160" fill="url(#glow4)"/>

  <text x="640" y="48" text-anchor="middle" font-size="26" font-weight="800" fill="#ffffff">Local-first by design</text>
  <text x="640" y="76" text-anchor="middle" font-size="15" fill="#98a0ae">Your data lives on your device &#8212; only the prompt crosses the wire, and the edge keeps nothing</text>

  <!-- LEFT: device -->
  <g>
    <rect x="70" y="100" width="400" height="150" rx="16" fill="#0f1117" stroke="#006B3F" stroke-opacity="0.7" stroke-width="2"/>
    <text x="270" y="132" text-anchor="middle" font-size="16" font-weight="800" fill="#4cc38a">🖥️ ON YOUR DEVICE</text>
    <!-- laptop + lock -->
    <g transform="translate(96,150)">
      <rect x="0" y="0" width="74" height="48" rx="6" fill="none" stroke="#4cc38a" stroke-width="2.5"/>
      <path d="M-10 56h94l-6-8H-4z" fill="#4cc38a" fill-opacity="0.35" stroke="#4cc38a" stroke-width="2"/>
      <rect x="24" y="16" width="26" height="20" rx="4" fill="#006B3F"/>
      <path d="M30 16v-4a7 7 0 0 1 14 0v4" fill="none" stroke="#4cc38a" stroke-width="2.5"/>
      <circle cx="37" cy="26" r="3" fill="#a7f3c9"/>
    </g>
    <g font-size="13" fill="#c8cdd8">
      <text x="210" y="166">▪ History, bookmarks &amp; tabs</text>
      <text x="210" y="190">▪ Credentials &amp; settings</text>
      <text x="210" y="214">▪ SQLite — encrypted at rest</text>
      <text x="210" y="238" fill="#4cc38a" font-weight="700">Never uploaded. Never synced without you.</text>
    </g>
  </g>

  <!-- MIDDLE: the wire -->
  <g>
    <path d="M490 175 H 790" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round"/>
    <!-- prompt packet -->
    <g transform="translate(600,143)">
      <rect width="80" height="64" rx="12" fill="#161a23" stroke="#FCD116" stroke-width="2"/>
      <path d="M46 12l-16 20h10l-7 20 19-24h-11z" fill="url(#bolt3)"/>
      <text x="40" y="58" text-anchor="middle" font-size="10" font-weight="700" fill="#FCD116">prompt only</text>
    </g>
    <path d="M500 168l14 7-14 7z" fill="#FCD116" fill-opacity="0.8"/>
    <path d="M780 168l-14 7 14 7z" fill="#FCD116" fill-opacity="0.8" transform="translate(14,0)"/>
    <text x="640" y="238" text-anchor="middle" font-size="12" fill="#98a0ae">device-authenticated &#183; rate-limited</text>
  </g>

  <!-- RIGHT: edge worker -->
  <g>
    <rect x="810" y="100" width="400" height="150" rx="16" fill="#0f1117" stroke="#D4A017" stroke-opacity="0.7" stroke-width="2"/>
    <text x="1010" y="132" text-anchor="middle" font-size="16" font-weight="800" fill="#D4A017">☁️ CLOUDFLARE EDGE</text>
    <!-- cloud + bolt -->
    <g transform="translate(836,150)">
      <path d="M18 44a14 14 0 0 1 2-27 18 18 0 0 1 34-6 14 14 0 0 1 20 13 12 12 0 0 1-4 20z" fill="none" stroke="#D4A017" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M50 20l-12 16h7l-5 14 14-18h-8z" fill="url(#bolt3)"/>
    </g>
    <g font-size="13" fill="#c8cdd8">
      <text x="950" y="166">▪ Stateless AI microservice (Hono)</text>
      <text x="950" y="190">▪ Chat &#183; summarize &#183; translate &#183; search</text>
      <text x="950" y="214">▪ 6 models via Workers AI</text>
      <text x="950" y="238" fill="#D4A017" font-weight="700">No logs &#183; no storage &#183; no user data</text>
    </g>
  </g>

  <!-- bottom stripe -->
  <rect x="0" y="313" width="426.7" height="7" fill="#CE1126"/>
  <rect x="426.7" y="313" width="426.7" height="7" fill="#FCD116"/>
  <rect x="853.4" y="313" width="426.6" height="7" fill="#006B3F"/>
</svg>
