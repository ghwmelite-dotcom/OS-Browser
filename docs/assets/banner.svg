<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="gh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CE1126"/>
      <stop offset="50%" stop-color="#FCD116"/>
      <stop offset="100%" stop-color="#006B3F"/>
    </linearGradient>
    <linearGradient id="shieldG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#FCD116"/>
    </linearGradient>
    <linearGradient id="titleG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#D4A017"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4A017" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#D4A017" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#006B3F" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#006B3F" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- canvas -->
  <rect width="1280" height="360" fill="#050505"/>
  <ellipse cx="200" cy="180" rx="340" ry="220" fill="url(#glow)"/>
  <ellipse cx="1140" cy="320" rx="380" ry="200" fill="url(#glowG)"/>

  <!-- faint grid -->
  <g stroke="#ffffff" stroke-opacity="0.04">
    <path d="M0 90h1280M0 180h1280M0 270h1280"/>
    <path d="M160 0v360M320 0v360M480 0v360M640 0v360M800 0v360M960 0v360M1120 0v360"/>
  </g>

  <!-- logo mark: flag-gradient rounded square + shield + OS -->
  <g transform="translate(64,92)">
    <rect width="176" height="176" rx="40" fill="url(#gh)"/>
    <path d="M88 30 L132 47 L132 92 Q132 126 88 147 Q44 126 44 92 L44 47 Z"
          fill="url(#shieldG)" stroke="#050505" stroke-width="2.5" stroke-linejoin="round" opacity="0.96"/>
    <text x="88" y="106" text-anchor="middle" font-family="Georgia, 'Bookman Old Style', serif" font-weight="900" font-size="56" fill="#0f1117" letter-spacing="-3">OS</text>
  </g>

  <!-- wordmark + tagline -->
  <text x="276" y="176" font-size="72" font-weight="800" letter-spacing="-1" fill="url(#titleG)">OS Browser</text>
  <text x="280" y="222" font-size="23" font-weight="500" fill="#c8cdd8">Ghana&#8217;s AI-Powered Desktop Browser</text>

  <!-- stat chips -->
  <g font-size="15" font-weight="600">
    <g>
      <rect x="280" y="248" width="112" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#D4A017" stroke-opacity="0.55"/>
      <text x="336" y="270" text-anchor="middle" fill="#D4A017">Electron 33</text>
    </g>
    <g>
      <rect x="404" y="248" width="104" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#CE1126" stroke-opacity="0.55"/>
      <text x="456" y="270" text-anchor="middle" fill="#ef6d7d">Workers AI</text>
    </g>
    <g>
      <rect x="520" y="248" width="168" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#006B3F" stroke-opacity="0.7"/>
      <text x="604" y="270" text-anchor="middle" fill="#4cc38a">Network Ad-Blocking</text>
    </g>
  </g>

  <!-- stylized browser window (right) -->
  <g transform="translate(772,54)">
    <!-- window frame -->
    <rect width="440" height="252" rx="16" fill="#0f1117" stroke="#ffffff" stroke-opacity="0.12"/>
    <!-- title bar -->
    <path d="M0 16a16 16 0 0 1 16-16h408a16 16 0 0 1 16 16v18H0z" fill="#161a23"/>
    <circle cx="24" cy="17" r="6" fill="#CE1126"/>
    <circle cx="46" cy="17" r="6" fill="#FCD116"/>
    <circle cx="68" cy="17" r="6" fill="#006B3F"/>
    <!-- address bar -->
    <rect x="92" y="7" width="230" height="20" rx="10" fill="#050505" stroke="#ffffff" stroke-opacity="0.10"/>
    <text x="104" y="21" font-size="11" fill="#8f96a3">https://osbrowser.askozzy.work</text>
    <!-- tab strip hint -->
    <rect x="0" y="34" width="440" height="4" fill="url(#gh)" opacity="0.85"/>

    <!-- page content -->
    <g>
      <rect x="20" y="58" width="180" height="14" rx="7" fill="#ffffff" fill-opacity="0.14"/>
      <rect x="20" y="84" width="252" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.08"/>
      <rect x="20" y="102" width="228" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.08"/>
      <rect x="20" y="120" width="240" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.08"/>
      <!-- gov portal shortcuts -->
      <g font-size="9" font-weight="700" text-anchor="middle">
        <rect x="20" y="146" width="56" height="40" rx="8" fill="#CE1126" fill-opacity="0.18" stroke="#CE1126" stroke-opacity="0.5"/>
        <text x="48" y="170" fill="#ef6d7d">GRA</text>
        <rect x="88" y="146" width="56" height="40" rx="8" fill="#FCD116" fill-opacity="0.15" stroke="#FCD116" stroke-opacity="0.5"/>
        <text x="116" y="170" fill="#FCD116">GIFMIS</text>
        <rect x="156" y="146" width="56" height="40" rx="8" fill="#006B3F" fill-opacity="0.20" stroke="#006B3F" stroke-opacity="0.6"/>
        <text x="184" y="170" fill="#4cc38a">SSNIT</text>
        <rect x="224" y="146" width="56" height="40" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18"/>
        <text x="252" y="170" fill="#c8cdd8">OHCS</text>
      </g>
      <rect x="20" y="202" width="120" height="24" rx="12" fill="#006B3F" fill-opacity="0.35" stroke="#006B3F"/>
      <text x="80" y="218" text-anchor="middle" font-size="11" font-weight="700" fill="#7ee2ae">gov.gh ready</text>
    </g>

    <!-- AI sidebar -->
    <g transform="translate(312,46)">
      <rect width="112" height="190" rx="10" fill="#10131b" stroke="#D4A017" stroke-opacity="0.45"/>
      <rect width="112" height="26" rx="10" fill="#D4A017" fill-opacity="0.14"/>
      <path d="M22 6l-9 11h5.5L14 27l12-13h-6.5z" fill="url(#shieldG)"/>
      <text x="34" y="18" font-size="11" font-weight="700" fill="#D4A017">AI Sidebar</text>
      <rect x="10" y="38" width="74" height="22" rx="8" fill="#ffffff" fill-opacity="0.08"/>
      <rect x="28" y="68" width="74" height="22" rx="8" fill="#006B3F" fill-opacity="0.3"/>
      <rect x="10" y="98" width="74" height="22" rx="8" fill="#ffffff" fill-opacity="0.08"/>
      <rect x="28" y="128" width="74" height="22" rx="8" fill="#CE1126" fill-opacity="0.25"/>
      <rect x="10" y="160" width="92" height="20" rx="10" fill="#050505" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="20" y="174" font-size="9" fill="#8f96a3">Summarize in Twi&#8230;</text>
    </g>
  </g>

  <!-- bottom Ghana stripe -->
  <rect x="0" y="352" width="426.7" height="8" fill="#CE1126"/>
  <rect x="426.7" y="352" width="426.7" height="8" fill="#FCD116"/>
  <rect x="853.4" y="352" width="426.6" height="8" fill="#006B3F"/>
</svg>
